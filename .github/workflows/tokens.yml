name: tokens
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (fails on any contrast failure)
        run: node engine/build.mjs client
      - name: Generated files are committed
        run: git diff --exit-code -- client/dist client/docs || (echo "::error::client/dist is stale. Run node engine/build.mjs client and commit." && exit 1)
